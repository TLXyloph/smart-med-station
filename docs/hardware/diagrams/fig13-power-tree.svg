  <line x1="1070" y1="744" x2="1106" y2="744" stroke="#111827" stroke-width="2"/>
  <text x="1114" y="748" font-size="12" fill="#1F2937">GND</text>
  <line x1="1180" y1="744" x2="1216" y2="744" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="7,4"/>
  <text x="1224" y="748" font-size="12" fill="#1F2937">Backup path (dashed)</text>

  <text x="560" y="786" font-size="12" font-weight="bold" fill="#374151">Blocks</text>
  <rect x="620" y="775" width="22" height="14" rx="3" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="650" y="786" font-size="12" fill="#1F2937">Power source</text>
  <rect x="770" y="775" width="22" height="14" rx="3" fill="#DDD6FE" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="800" y="786" font-size="12" fill="#1F2937">Compute</text>
  <rect x="890" y="775" width="22" height="14" rx="3" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
  <text x="920" y="786" font-size="12" fill="#1F2937">Regulator / 3.3 V rail</text>
  <rect x="1080" y="775" width="22" height="14" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="1110" y="786" font-size="12" fill="#1F2937">Servo rail</text>
  <rect x="1210" y="775" width="22" height="14" rx="3" fill="#FDE68A" stroke="#B45309" stroke-width="1.5"/>
  <text x="1240" y="786" font-size="12" fill="#1F2937">Actuator (servo)</text>
  <rect x="1380" y="775" width="22" height="14" rx="3" fill="#BBF7D0" stroke="#15803D" stroke-width="1.5"/>
  <text x="1410" y="786" font-size="12" fill="#1F2937">Sensor load</text>

  <!-- Footer -->
