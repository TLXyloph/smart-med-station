  <!-- Header -->
  <text x="40" y="48" font-size="24" font-weight="bold" fill="#111827">Fig 13 — Power distribution and current budget</text>
  <text x="40" y="74" font-size="14" fill="#4B5563">Logic runs from the host USB through the micro:bit 3.3 V regulator; servos run from a separate 5 V supply on the robot:bit rail, one moving at a time.</text>

  <!-- ================= A: logic power ================= -->
  <text x="40" y="114" font-size="12" font-weight="bold" fill="#4B5563" letter-spacing="0.5">A · LOGIC POWER — host USB → micro:bit regulator → 3.3 V rail</text>

  <rect x="40" y="130" width="180" height="76" rx="6" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="130" y="163" class="lbl b mid">Wall adapter</text>
  <text x="130" y="183" class="sec mid">5 V / 4 A USB-C</text>

  <line x1="220" y1="168" x2="259" y2="168" stroke="#DC2626" stroke-width="2.5" marker-end="url(#aRed)"/>
  <text x="238" y="160" font-size="11" fill="#DC2626" text-anchor="middle">5 V</text>

  <rect x="260" y="130" width="150" height="76" rx="6" fill="#DDD6FE" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="335" y="163" class="lbl b mid">Orange Pi 5</text>
  <text x="335" y="183" class="sec mid">host computer</text>

  <line x1="410" y1="168" x2="449" y2="168" stroke="#DC2626" stroke-width="2.5" marker-end="url(#aRed)"/>
  <text x="428" y="160" font-size="11" fill="#DC2626" text-anchor="middle">5 V</text>

  <rect x="450" y="130" width="150" height="76" rx="6" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.5"/>
  <text x="525" y="163" class="lbl b mid">USB port</text>
  <text x="525" y="183" class="sec mid">5 V out (host)</text>

  <line x1="600" y1="168" x2="639" y2="168" stroke="#4B5563" stroke-width="3" marker-end="url(#aGry)"/>
  <text x="618" y="160" font-size="11" fill="#4B5563" text-anchor="middle">USB</text>

  <rect x="640" y="130" width="170" height="76" rx="6" fill="#DDD6FE" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="725" y="155" class="lbl b mid">micro:bit V2</text>
  <text x="725" y="174" class="sec mid">USB 5 V in</text>
  <text x="725" y="192" class="sm mid">~30–60 mA (verify)</text>

  <line x1="810" y1="168" x2="849" y2="168" stroke="#DC2626" stroke-width="2.5" marker-end="url(#aRed)"/>
  <text x="828" y="160" font-size="11" fill="#DC2626" text-anchor="middle">5 V</text>

  <rect x="850" y="130" width="160" height="76" rx="6" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
  <text x="930" y="163" class="lbl b mid">3.3 V regulator</text>
  <text x="930" y="183" class="sec mid">on the micro:bit</text>

  <line x1="1010" y1="168" x2="1049" y2="168" stroke="#EA580C" stroke-width="2.5" marker-end="url(#aOrg)"/>
  <text x="1029" y="160" font-size="11" fill="#EA580C" text-anchor="middle">3.3 V</text>

  <rect x="1050" y="130" width="190" height="76" rx="6" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.5"/>
  <text x="1145" y="163" class="lbl b mid">3.3 V rail</text>
  <text x="1145" y="183" class="sec mid">edge 3V · 190 mA budget</text>

  <!-- 3.3 V branch to loads -->
  <g fill="none" stroke="#EA580C" stroke-width="2">
    <line x1="1240" y1="168" x2="1265" y2="168"/>
    <line x1="1265" y1="118" x2="1265" y2="218"/>
    <line x1="1265" y1="118" x2="1289" y2="118" marker-end="url(#aOrg)"/>
    <line x1="1265" y1="168" x2="1289" y2="168" marker-end="url(#aOrg)"/>
    <line x1="1265" y1="218" x2="1289" y2="218" marker-end="url(#aOrg)"/>
  </g>
  <circle cx="1265" cy="168" r="3.5" fill="#EA580C"/>
  <rect x="1290" y="98" width="270" height="40" rx="6" fill="#BBF7D0" stroke="#15803D" stroke-width="1.5"/>
  <text x="1302" y="123" font-size="13" font-weight="bold" fill="#1F2937">RC522 RFID reader</text>
  <text x="1548" y="123" font-size="13" fill="#1F2937" text-anchor="end">13–26 mA</text>
  <rect x="1290" y="148" width="270" height="40" rx="6" fill="#BBF7D0" stroke="#15803D" stroke-width="1.5"/>
  <text x="1302" y="173" font-size="13" font-weight="bold" fill="#1F2937">HX711 + load cell</text>
  <text x="1548" y="173" font-size="13" fill="#1F2937" text-anchor="end">~1.5 mA</text>
  <rect x="1290" y="198" width="270" height="40" rx="6" fill="#BBF7D0" stroke="#15803D" stroke-width="1.5"/>
  <text x="1302" y="223" font-size="13" font-weight="bold" fill="#1F2937">Hatch-switch pull-up (P0)</text>
  <text x="1548" y="223" font-size="13" fill="#1F2937" text-anchor="end">≈ 0</text>

  <!-- ================= Common ground ================= -->
  <g fill="none" stroke="#111827" stroke-width="2">
    <polyline points="335,206 335,262 725,262 725,206"/>
    <line x1="460" y1="262" x2="460" y2="360"/>
    <line x1="560" y1="262" x2="560" y2="276"/>
    <line x1="546" y1="276" x2="574" y2="276"/>
    <line x1="551" y1="282" x2="569" y2="282"/>
    <line x1="556" y1="288" x2="564" y2="288"/>
  </g>
  <circle cx="460" cy="262" r="3.5" fill="#111827"/>
  <circle cx="560" cy="262" r="3.5" fill="#111827"/>
  <text x="586" y="284" font-size="12" font-weight="bold" fill="#111827">Common ground</text>
  <text x="586" y="300" font-size="11" fill="#374151">USB GND = micro:bit GND = robot:bit GND</text>
  <text x="343" y="244" font-size="11" fill="#111827">GND</text>

  <!-- ================= B: servo power ================= -->
  <text x="40" y="338" font-size="12" font-weight="bold" fill="#4B5563" letter-spacing="0.5">B · SERVO POWER — robot:bit rail VM (not regulated)</text>

  <rect x="40" y="360" width="220" height="76" rx="6" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="150" y="393" class="lbl b mid">5 V / ≥2.5 A supply</text>
  <text x="150" y="413" class="sec mid">3 A max · PRIMARY</text>

  <line x1="260" y1="398" x2="309" y2="398" stroke="#DC2626" stroke-width="2.5" marker-end="url(#aRed)"/>
  <text x="284" y="390" font-size="11" fill="#DC2626" text-anchor="middle">DC IN</text>

  <rect x="310" y="360" width="180" height="76" rx="6" fill="#DDD6FE" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="400" y="393" class="lbl b mid">robot:bit V2</text>
  <text x="400" y="413" class="sec mid">DC IN 5 V · 18650 holder</text>

  <line x1="490" y1="398" x2="539" y2="398" stroke="#DC2626" stroke-width="2.5" marker-end="url(#aRed)"/>
  <text x="514" y="390" font-size="11" fill="#DC2626" text-anchor="middle">VM</text>

  <rect x="540" y="360" width="250" height="76" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="665" y="393" class="lbl b mid">Servo rail VM</text>
  <text x="665" y="413" class="sec mid">unregulated: 5 V ext / 3.7 V battery</text>

  <!-- servo bus -->
  <g fill="none" stroke="#DC2626" stroke-width="2">
    <line x1="790" y1="398" x2="820" y2="398"/>
    <line x1="820" y1="350" x2="820" y2="446"/>
    <line x1="820" y1="350" x2="849" y2="350" marker-end="url(#aRed)"/>
    <line x1="820" y1="398" x2="849" y2="398" marker-end="url(#aRed)"/>
    <line x1="820" y1="446" x2="849" y2="446" marker-end="url(#aRed)"/>
  </g>
  <circle cx="820" cy="398" r="3.5" fill="#DC2626"/>
  <g fill="#FDE68A" stroke="#B45309" stroke-width="1.5">
    <rect x="850" y="333" width="200" height="34" rx="5"/>
    <rect x="850" y="381" width="200" height="34" rx="5"/>
    <rect x="850" y="429" width="200" height="34" rx="5"/>
  </g>
  <text x="862" y="354" class="cell"><tspan font-weight="bold">S1</tspan> turret drive · MG90S</text>
  <text x="862" y="402" class="cell"><tspan font-weight="bold">S2</tspan> dosing disc · MG90S</text>
  <text x="862" y="450" class="cell"><tspan font-weight="bold">S3</tspan> hatch latch · MG90S</text>
  <text x="850" y="486" class="sm">S4–S8 ports spare (no load)</text>

  <!-- ================= C: backup ================= -->
  <rect x="40" y="468" width="220" height="76" rx="6" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="150" y="499" class="lbl b mid">18650 Li-ion 3.7 V</text>
  <text x="150" y="519" class="sec mid">backup · ≤ 1 A · weaker servos</text>
  <polyline points="260,506 400,506 400,437" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="7,4" marker-end="url(#aRed)"/>
  <text x="330" y="498" font-size="11" fill="#DC2626" text-anchor="middle">backup</text>

  <!-- ================= Current budget table ================= -->
  <text x="1070" y="318" font-size="15" font-weight="bold" fill="#111827">Current budget</text>
  <rect x="1070" y="328" width="490" height="28" fill="#F3F4F6"/>
  <rect x="1070" y="356" width="490" height="27" fill="#FFFFFF"/>
  <rect x="1070" y="383" width="490" height="27" fill="#F9FAFB"/>
  <rect x="1070" y="410" width="490" height="27" fill="#FFFFFF"/>
  <rect x="1070" y="437" width="490" height="27" fill="#F9FAFB"/>
  <rect x="1070" y="464" width="490" height="27" fill="#FFFFFF"/>
  <rect x="1070" y="491" width="490" height="27" fill="#F9FAFB"/>
  <rect x="1070" y="518" width="490" height="27" fill="#FEF3C7"/>
  <g stroke="#D1D5DB" stroke-width="1">
    <line x1="1070" y1="356" x2="1560" y2="356"/>
    <line x1="1070" y1="383" x2="1560" y2="383"/>
    <line x1="1070" y1="410" x2="1560" y2="410"/>
    <line x1="1070" y1="437" x2="1560" y2="437"/>
    <line x1="1070" y1="464" x2="1560" y2="464"/>
    <line x1="1070" y1="491" x2="1560" y2="491"/>
    <line x1="1070" y1="518" x2="1560" y2="518"/>
    <line x1="1248" y1="328" x2="1248" y2="545"/>
    <line x1="1314" y1="328" x2="1314" y2="545"/>
    <line x1="1430" y1="328" x2="1430" y2="545"/>
  </g>
  <rect x="1070" y="328" width="490" height="217" fill="none" stroke="#9CA3AF" stroke-width="1.2"/>
  <text x="1080" y="346" class="cell b">Load</text>
  <text x="1256" y="346" class="cell b">Rail</text>
  <text x="1322" y="346" class="cell b">Typical</text>
  <text x="1438" y="346" class="cell b">Peak / max</text>
  <text x="1080" y="374" class="cell">RC522</text>
  <text x="1256" y="374" class="cell">3.3 V</text>
  <text x="1322" y="374" class="cell">13–26 mA</text>
  <text x="1438" y="374" class="cell">26 mA</text>
  <text x="1080" y="401" class="cell">HX711</text>
  <text x="1256" y="401" class="cell">3.3 V</text>
  <text x="1322" y="401" class="cell">1.5 mA</text>
  <text x="1438" y="401" class="cell">1.5 mA</text>
  <text x="1080" y="428" class="cell">micro:bit V2</text>
  <text x="1256" y="428" class="cell">USB 5 V</text>
  <text x="1322" y="428" class="cell">~30–60 mA&#160;<tspan font-size="11" fill="#6B7280">(verify)</tspan></text>
  <text x="1438" y="428" class="cell">—</text>
  <text x="1080" y="455" class="cell">One servo moving (MG90S)</text>
  <text x="1256" y="455" class="cell">VM</text>
  <text x="1322" y="455" class="cell"><tspan fill="#6B7280">verify (bench)</tspan></text>
  <text x="1438" y="455" class="cell">≤ ~1 A</text>
  <text x="1080" y="482" class="cell">S1 holding while S2 moves</text>
  <text x="1256" y="482" class="cell">VM</text>
  <text x="1322" y="482" class="cell">≈ tens of mA</text>
  <text x="1438" y="482" class="cell">—</text>
  <text x="1080" y="509" class="cell">Servo idle, PWM off</text>
  <text x="1256" y="509" class="cell">VM</text>
  <text x="1322" y="509" class="cell">≈ 0</text>
  <text x="1438" y="509" class="cell">—</text>
  <text x="1080" y="536" class="cell b">Peak servo rail</text>
  <text x="1256" y="536" class="cell b">VM</text>
  <text x="1322" y="536" class="cell">—</text>
  <text x="1438" y="536" class="cell b">≤ ~1 A</text>
  <text x="1070" y="563" class="sm">3.3 V total ≈ 30 mA, well under the 190 mA edge budget · servo supply rated ≥ 2.5 A</text>

  <!-- ================= Rules ================= -->
  <rect x="40" y="600" width="360" height="96" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="56" y="622" font-size="11" font-weight="bold" fill="#B45309" letter-spacing="0.5">RULE 1</text>
  <text x="56" y="644" font-size="13" font-weight="bold" fill="#1F2937">ONE servo MOVING at a time</text>
  <text x="56" y="664" class="sec">S1 holds position while S2 moves;</text>
  <text x="56" y="681" class="sec">peak servo rail ≤ ~1 A</text>

  <rect x="420" y="600" width="440" height="96" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="436" y="622" font-size="11" font-weight="bold" fill="#B45309" letter-spacing="0.5">RULE 2</text>
  <text x="436" y="644" font-size="13" font-weight="bold" fill="#1F2937">PWM off (PCA9685 full-off) after move + 300 ms</text>
  <text x="436" y="664" class="sec">S1 stays powered until the disc is back at REST, then off;</text>
  <text x="436" y="681" class="sec">idle: friction + gearbox hold the turret, spring holds the bolt</text>

  <rect x="880" y="600" width="680" height="96" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="896" y="622" font-size="11" font-weight="bold" fill="#B45309" letter-spacing="0.5">RULE 3 · POWER LOSS</text>
  <text x="896" y="644" font-size="13" font-weight="bold" fill="#1F2937">Power loss → hatch stays LOCKED, disc stays at REST,</text>
  <text x="896" y="663" font-size="13" font-weight="bold" fill="#1F2937">micro:bit boots SAFE. Override key still works; turret can be turned by hand.</text>
  <text x="896" y="683" class="sec">Edge case: disc stopped at LOAD → driving it to REST at boot releases that vial; host logs a recovered dispense.</text>

