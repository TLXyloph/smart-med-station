  <rect x="40" y="724" width="470" height="40" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2"/>
  <text x="56" y="749" font-size="12" fill="#4B5563">Product path (future): 12 V vehicle → buck to 5 V + UPS backup</text>

