<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Fig 1 — System architecture</title>
  <style>
    .lbl { font-size: 14px; fill: #1F2937; }
    .sec { font-size: 12px; fill: #4B5563; }
    .sm  { font-size: 11px; fill: #4B5563; }
    .b   { font-weight: bold; }
    .mid { text-anchor: middle; }
    .mono { font-family: Menlo, Consolas, "Courier New", monospace; }
    .grp { font-size: 11px; font-weight: bold; fill: #4B5563; letter-spacing: 0.5px; }
  </style>
  <defs>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,1 L10,5 L0,9 z" fill="#DC2626"/>
    </marker>
    <marker id="aMot" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,1 L10,5 L0,9 z" fill="#1D4ED8"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="40" y="48" font-size="24" font-weight="bold" fill="#111827">Fig 1 — System architecture</text>
  <text x="40" y="74" font-size="14" fill="#4B5563">Orange Pi 5 host runs UI, dose logic, auth and audit log; one USB serial link drives the micro:bit controller inside the Med Tower, whose whole housing is the locked safe.</text>

  <!-- ================= HOST zone ================= -->
  <rect x="40" y="96" width="430" height="640" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="58" y="120" font-size="13" font-weight="bold" fill="#4B5563" letter-spacing="1">HOST</text>

  <rect x="60" y="134" width="210" height="48" rx="6" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="165" y="163" class="lbl b mid" font-size="13">5 V / 4 A USB-C adapter</text>
  <line x1="165" y1="182" x2="165" y2="213" stroke="#DC2626" stroke-width="2.5" marker-end="url(#aRed)"/>
  <text x="174" y="203" font-size="12" fill="#DC2626">5 V</text>

  <rect x="60" y="214" width="380" height="220" rx="8" fill="#DDD6FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="80" y="242" font-size="16" font-weight="bold" fill="#1F2937">Orange Pi 5 (RK3588S)</text>
  <text x="80" y="262" class="sec">Host computer · uses zero GPIO</text>
  <g fill="#6D28D9">
    <circle cx="86" cy="290" r="2.5"/><circle cx="86" cy="318" r="2.5"/><circle cx="86" cy="346" r="2.5"/>
    <circle cx="86" cy="374" r="2.5"/><circle cx="86" cy="402" r="2.5"/>
  </g>
  <text x="96" y="295" class="lbl">UI (touch / keyboard)</text>
  <text x="96" y="323" class="lbl">Dose calculator (formulary file)</text>
  <text x="96" y="351" class="lbl">Auth: PIN + RFID badge, per-column CS rules</text>
  <text x="96" y="379" class="lbl">Audit log (CSV / SQLite)</text>
  <text x="96" y="407" class="lbl">Calibration + per-drug unit masses</text>

  <line x1="145" y1="434" x2="145" y2="490" stroke="#4B5563" stroke-width="2"/>
  <text x="153" y="466" class="sm">HDMI</text>
  <line x1="355" y1="434" x2="355" y2="490" stroke="#4B5563" stroke-width="3"/>
  <text x="363" y="466" class="sm">USB</text>
  <rect x="60" y="490" width="170" height="50" rx="6" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.5"/>
  <text x="145" y="520" class="lbl mid">HDMI display</text>
  <rect x="270" y="490" width="170" height="50" rx="6" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.5"/>
  <text x="355" y="520" class="lbl mid" font-size="13">USB keyboard / mouse</text>

  <rect x="60" y="580" width="380" height="110" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="80" y="608" class="lbl b">Laptop — fallback host</text>
  <text x="80" y="630" class="sec">Drop-in replacement for the Orange Pi:</text>
  <text x="80" y="648" class="sec">same host software, same USB cable</text>
  <text x="80" y="666" class="sec">to the micro:bit (one host at a time).</text>
  <polyline points="440,635 455,635 455,300" fill="none" stroke="#4B5563" stroke-width="3" stroke-dasharray="8,5"/>

  <!-- ================= MED TOWER boundary (drawn first so lines sit on top) ================= -->
  <rect x="800" y="96" width="760" height="690" rx="10" fill="#FEF2F2" fill-opacity="0.45" stroke="#DC2626" stroke-width="2" stroke-dasharray="8,5"/>
  <rect x="818" y="111" width="12" height="10" rx="1.5" fill="#DC2626"/>
  <path d="M820.5,111 v-3 a3.5,3.5 0 0 1 7,0 v3" fill="none" stroke="#DC2626" stroke-width="1.6"/>
  <text x="838" y="121" font-size="14" font-weight="bold" fill="#DC2626">MED TOWER (the whole housing is the locked safe)</text>

  <!-- ================= USB link (middle) ================= -->
  <line x1="440" y1="300" x2="846" y2="300" stroke="#4B5563" stroke-width="3"/>
  <circle cx="455" cy="300" r="3.5" fill="#4B5563"/>
  <text x="640" y="250" class="mid b" font-size="13" fill="#374151">USB CDC serial · 115200 8N1</text>
  <text x="640" y="268" class="sec mid">/dev/ttyACM0 · + 5 V logic power</text>

  <line x1="640" y1="322" x2="640" y2="304" stroke="#6B7280" stroke-width="1"/>
  <circle cx="640" cy="302" r="2.5" fill="#6B7280"/>
  <rect x="490" y="322" width="300" height="252" rx="6" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.2"/>
  <text x="506" y="344" font-size="13" font-weight="bold" fill="#1F2937">Line protocol (ASCII, \n-terminated)</text>
  <text x="506" y="368" class="sec">host → device</text>
  <text x="506" y="388" class="mono" font-size="13" fill="#1F2937">&lt;seq&gt; CMD args</text>
  <text x="506" y="412" class="sec">device → host · reply</text>
  <text x="506" y="432" class="mono" font-size="13" fill="#1F2937">&lt;seq&gt; OK|ERR …</text>
  <text x="506" y="456" class="sec">device → host · async event</text>
  <text x="506" y="476" class="mono" font-size="13" fill="#1F2937">! EVENT …</text>
  <line x1="506" y1="490" x2="774" y2="490" stroke="#E5E7EB" stroke-width="1"/>
  <text x="506" y="510" class="mono" font-size="11" fill="#4B5563">7 DISPENSE 6 → 7 OK col=6 pre=… post=…</text>
  <text x="506" y="526" class="mono" font-size="11" fill="#4B5563">! HATCH OPEN   ! TAG 04A1B2C3</text>
  <text x="506" y="548" class="sm">Watchdog: host traffic ≥ every 2 s; device →</text>
  <text x="506" y="563" class="sm">SAFE after 10 s of host silence.</text>

  <!-- Servo supply -->
  <rect x="490" y="128" width="290" height="56" rx="6" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="635" y="151" class="lbl b mid" font-size="13">5 V / ≥2.5 A supply (3 A max)</text>
  <text x="635" y="170" class="sec mid">→ robot:bit DC IN · servo rail</text>
  <polyline points="780,156 880,156 880,189" fill="none" stroke="#DC2626" stroke-width="2.5" marker-end="url(#aRed)"/>
  <text x="888" y="182" font-size="11" fill="#DC2626">DC IN</text>

  <!-- 18650 backup -->
  <rect x="1010" y="134" width="160" height="42" rx="6" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="1090" y="152" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">18650 backup</text>
  <text x="1090" y="168" class="sm mid">3.7 V · ~1 A · weaker servos</text>
  <line x1="1090" y1="176" x2="1090" y2="190" stroke="#DC2626" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- ================= Controller ================= -->
  <rect x="830" y="190" width="350" height="350" rx="8" fill="#F5F3FF" stroke="#6D28D9" stroke-width="2"/>
  <text x="846" y="211" font-size="12" font-weight="bold" fill="#5B21B6">robot:bit V2 · on the housing wall</text>

  <rect x="846" y="222" width="318" height="130" rx="6" fill="#DDD6FE" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="862" y="245" font-size="15" font-weight="bold" fill="#1F2937">micro:bit V2 (nRF52833)</text>
  <text x="862" y="263" class="sec">MicroPython · wall-mounted, not weighed</text>
  <text x="862" y="287" font-size="12" fill="#1F2937">• Accelerometer — tamper / shock on the safe</text>
  <text x="862" y="305" font-size="12" fill="#1F2937">• Temperature — storage-temp log</text>
  <text x="862" y="323" font-size="12" fill="#1F2937">• Speaker — alerts</text>

  <line x1="900" y1="352" x2="900" y2="410" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="908" y="386" font-size="12" fill="#7C3AED">I2C P19/P20</text>
  <line x1="1090" y1="352" x2="1090" y2="410" stroke="#2563EB" stroke-width="2"/>
  <text x="1098" y="386" font-size="12" fill="#2563EB">P16</text>

  <rect x="846" y="410" width="160" height="60" rx="6" fill="#DDD6FE" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="926" y="436" class="lbl b mid">PCA9685 @0x40</text>
  <text x="926" y="454" class="sec mid">16-ch PWM · 50 Hz</text>
  <rect x="1020" y="410" width="144" height="60" rx="6" fill="#DDD6FE" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="1092" y="436" class="lbl b mid">4× RGB LEDs</text>
  <text x="1092" y="454" class="sec mid">WS2812 status</text>

  <line x1="926" y1="470" x2="926" y2="486" stroke="#2563EB" stroke-width="2"/>
  <rect x="846" y="486" width="318" height="36" rx="4" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1"/>
  <text x="1005" y="509" font-size="12" fill="#1F2937" text-anchor="middle">Ports S1–S8 = PCA9685 ch 8–15 · S1–S3 used</text>

  <!-- ================= Right column: hatch, weighed module, load cell ================= -->
  <rect x="1200" y="146" width="330" height="150" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="1214" y="165" class="grp">TOP COVER · RESTOCK HATCH (one column wide)</text>
  <rect x="1200" y="310" width="330" height="150" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="1214" y="329" class="grp">WEIGHED MODULE · rides on the load cell</text>

  <g stroke="#2563EB" stroke-width="2">
    <line x1="1180" y1="199" x2="1214" y2="199"/>
    <line x1="1180" y1="259" x2="1214" y2="259"/>
    <line x1="1180" y1="363" x2="1214" y2="363"/>
    <line x1="1180" y1="423" x2="1214" y2="423"/>
    <line x1="1180" y1="510" x2="1214" y2="510"/>
  </g>

  <rect x="1214" y="174" width="302" height="50" rx="6" fill="#FDE68A" stroke="#B45309" stroke-width="1.5"/>
  <text x="1228" y="195" class="lbl b">S3 · hatch latch cam</text>
  <text x="1228" y="214" class="sec">MG90S · ch 10 · spring bolt, fail-secure</text>
  <rect x="1214" y="234" width="302" height="50" rx="6" fill="#BBF7D0" stroke="#15803D" stroke-width="1.5"/>
  <text x="1228" y="255" class="lbl b">Hatch switch · KW11-3Z</text>
  <text x="1228" y="274" class="sec">P0 · LOW = closed, HIGH = open</text>

  <rect x="1214" y="338" width="302" height="50" rx="6" fill="#FDE68A" stroke="#B45309" stroke-width="1.5"/>
  <text x="1228" y="359" class="lbl b">S1 · turret drive</text>
  <text x="1228" y="378" class="sec">MG90S · ch 8 · 48T → 24T, 2:1 step-up</text>
  <rect x="1214" y="398" width="302" height="50" rx="6" fill="#FDE68A" stroke="#B45309" stroke-width="1.5"/>
  <text x="1228" y="419" class="lbl b">S2 · dosing disc</text>
  <text x="1228" y="438" class="sec">MG90S · ch 9 · rests at REST, pocket empty</text>

  <line x1="1365" y1="460" x2="1365" y2="481" stroke="#DC2626" stroke-width="2" marker-end="url(#aRed)"/>
  <text x="1373" y="475" font-size="11" fill="#DC2626">weight</text>
  <rect x="1214" y="482" width="302" height="56" rx="6" fill="#BBF7D0" stroke="#15803D" stroke-width="1.5"/>
  <text x="1228" y="504" class="lbl b">HX711 + 1 kg load cell</text>
  <text x="1228" y="523" class="sec">under the weighed module · DT P2 · SCK P1</text>

  <!-- ================= Front of tower ================= -->
  <rect x="820" y="620" width="724" height="152" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="836" y="762" class="grp">FRONT OF TOWER · behind the 2 mm front wall</text>
  <rect x="840" y="640" width="350" height="100" rx="6" fill="#BBF7D0" stroke="#15803D" stroke-width="1.5"/>
  <text x="856" y="663" class="lbl b">RC522 RFID reader · “TAP HERE” pad</text>
  <text x="856" y="682" class="sec">badge taps (2FA) + every dispensed vial</text>
  <text x="856" y="700" class="sec">SPI P13/P14/P15 · CS P8 · 3.3 V</text>
  <text x="856" y="718" class="sec">right beside the shared tray</text>
  <rect x="1214" y="640" width="316" height="100" rx="6" fill="#E5E7EB" stroke="#374151" stroke-width="1.5"/>
  <text x="1230" y="663" class="lbl b">SHARED PICKUP TRAY</text>
  <text x="1230" y="682" class="sec">≈60 × 40 × 25 mm · anti-reach flap</text>
  <text x="1230" y="700" class="sec">via exit hole + fixed chute from S2</text>
  <text x="1230" y="718" class="sec">chute + tray are not weighed</text>

  <!-- vial path: dosing disc -> exit hole -> fixed chute -> shared tray -->
  <polyline points="1516,423 1544,423 1544,600 1470,600 1470,639" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#aMot)"/>
  <text x="1462" y="604" font-size="11" fill="#1D4ED8" text-anchor="end">vial via fixed chute</text>

  <!-- SPI to front -->
  <line x1="900" y1="540" x2="900" y2="640" stroke="#0D9488" stroke-width="2.5"/>
  <text x="908" y="586" font-size="12" fill="#0D9488">SPI · 1 MHz</text>

  <!-- ================= Legend ================= -->
  <rect x="40" y="812" width="1520" height="140" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="60" y="846" font-size="12" font-weight="bold" fill="#374151">Blocks</text>
  <rect x="130" y="835" width="22" height="14" rx="3" fill="#DDD6FE" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="160" y="846" font-size="12" fill="#1F2937">Compute</text>
  <rect x="240" y="835" width="22" height="14" rx="3" fill="#BBF7D0" stroke="#15803D" stroke-width="1.5"/>
  <text x="270" y="846" font-size="12" fill="#1F2937">Sensor</text>
  <rect x="340" y="835" width="22" height="14" rx="3" fill="#FDE68A" stroke="#B45309" stroke-width="1.5"/>
  <text x="370" y="846" font-size="12" fill="#1F2937">Actuator (servo)</text>
  <rect x="495" y="835" width="22" height="14" rx="3" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="525" y="846" font-size="12" fill="#1F2937">Power source</text>
  <rect x="630" y="835" width="22" height="14" rx="3" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.5"/>
  <text x="660" y="846" font-size="12" fill="#1F2937">Host peripheral</text>
  <rect x="780" y="835" width="22" height="14" rx="3" fill="#E5E7EB" stroke="#374151" stroke-width="1.5"/>
  <text x="810" y="846" font-size="12" fill="#1F2937">Printed part (tray)</text>
  <rect x="950" y="835" width="22" height="14" rx="3" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="980" y="846" font-size="12" fill="#1F2937">Zone / sub-group</text>
  <rect x="1110" y="835" width="22" height="14" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="1140" y="846" font-size="12" fill="#1F2937">Security boundary (whole tower = safe)</text>

  <text x="60" y="888" font-size="12" font-weight="bold" fill="#374151">Lines</text>
  <line x1="130" y1="884" x2="166" y2="884" stroke="#4B5563" stroke-width="3"/>
  <text x="174" y="888" font-size="12" fill="#1F2937">USB</text>
  <line x1="240" y1="884" x2="276" y2="884" stroke="#DC2626" stroke-width="2.5"/>
  <text x="284" y="888" font-size="12" fill="#1F2937">5 V power</text>
  <line x1="380" y1="884" x2="416" y2="884" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="424" y="888" font-size="12" fill="#1F2937">I2C</text>
  <line x1="480" y1="884" x2="516" y2="884" stroke="#0D9488" stroke-width="2.5"/>
  <text x="524" y="888" font-size="12" fill="#1F2937">SPI</text>
  <line x1="580" y1="884" x2="616" y2="884" stroke="#2563EB" stroke-width="2"/>
  <text x="624" y="888" font-size="12" fill="#1F2937">Digital / PWM signal</text>
  <line x1="780" y1="884" x2="816" y2="884" stroke="#4B5563" stroke-width="3" stroke-dasharray="8,5"/>
  <text x="824" y="888" font-size="12" fill="#1F2937">Fallback / backup path (dashed)</text>
  <line x1="1060" y1="884" x2="1095" y2="884" stroke="#1D4ED8" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#aMot)"/>
  <text x="1104" y="888" font-size="12" fill="#1F2937">Vial path (motion)</text>
  <line x1="1260" y1="884" x2="1291" y2="884" stroke="#DC2626" stroke-width="2" marker-end="url(#aRed)"/>
  <text x="1300" y="888" font-size="12" fill="#1F2937">Weight on load cell</text>

  <text x="60" y="930" font-size="11" fill="#4B5563">Servo cables (blue) carry PWM + servo rail VM + GND, with slack loops into the weighed module; ONE servo MOVING at a time (S1 holds position while S2 moves). Pin-level wiring: Fig 14 · power and current budget: Fig 13.</text>

  <!-- Footer -->
  <text x="1560" y="984" font-size="11" fill="#9CA3AF" text-anchor="end">Smart Med Station · Hardware design v2.1 · 2026-10-07</text>
</svg>
