<g id="layer-text"><text xml:space="preserve" x="255.0" y="188.0" font-size="13" fill="#1F2937" text-anchor="middle"><tspan font-weight="bold" fill="#111827">1  </tspan>select protocol “Anaphylaxis”</text>
<text xml:space="preserve" x="255.0" y="205.0" font-size="13" fill="#1F2937" text-anchor="middle">enter weight, confirm kg / lb</text>
<text xml:space="preserve" x="440.0" y="240.0" font-size="13" fill="#1F2937"><tspan font-weight="bold" fill="#111827">2  </tspan>compute dose (mg) and volume (mL)</text>
<text xml:space="preserve" x="440.0" y="257.0" font-size="13" fill="#1F2937">for stocked concentration</text>
<text xml:space="preserve" x="440.0" y="274.0" font-size="13" fill="#1F2937">→ epinephrine, column 0</text>
<text xml:space="preserve" x="555.0" y="307.0" font-size="13" fill="#1F2937" text-anchor="middle"><tspan font-weight="bold" fill="#111827">3  </tspan><tspan font-family="Menlo, Consolas, monospace">31 DISPENSE 0</tspan></text>
<text xml:space="preserve" x="837.5" y="338.0" font-size="13" fill="#1F2937" text-anchor="middle"><tspan font-weight="bold" fill="#111827">4a  </tspan>pre-weigh (median of 7)</text>
<text xml:space="preserve" x="1220.0" y="369.0" font-size="13" fill="#1F2937" text-anchor="middle"><tspan font-weight="bold" fill="#111827">4b  </tspan>pre = 829570</text>
<text xml:space="preserve" x="837.5" y="400.0" font-size="13" fill="#1F2937" text-anchor="middle"><tspan font-weight="bold" fill="#111827">5  </tspan>S1 ramp to column 0 (if needed),</text>
<text xml:space="preserve" x="837.5" y="417.0" font-size="13" fill="#1F2937" text-anchor="middle">final approach from below;</text>
<text xml:space="preserve" x="837.5" y="434.0" font-size="13" fill="#1F2937" text-anchor="middle">S1 stays powered (holds)</text>
<text xml:space="preserve" x="837.5" y="465.0" font-size="13" fill="#1F2937" text-anchor="middle"><tspan font-weight="bold" fill="#111827">6a  </tspan>disc REST → LOAD</text>
<text xml:space="preserve" x="837.5" y="482.0" font-size="13" fill="#1F2937" text-anchor="middle">(vial drops in) → REST</text>
<text xml:space="preserve" x="837.5" y="499.0" font-size="13" fill="#1F2937" text-anchor="middle">(vial falls to chute → tray)</text>
<text xml:space="preserve" x="837.5" y="530.0" font-size="13" fill="#1F2937" text-anchor="middle"><tspan font-weight="bold" fill="#111827">6b  </tspan>S1 PWM off (disc is at REST)</text>
<text xml:space="preserve" x="770.0" y="565.0" font-size="13" fill="#1F2937"><tspan font-weight="bold" fill="#111827">7  </tspan>settle 1.0 s</text>
<text xml:space="preserve" x="837.5" y="607.0" font-size="13" fill="#1F2937" text-anchor="middle"><tspan font-weight="bold" fill="#111827">8a  </tspan>post-weigh (median of 7)</text>
<text xml:space="preserve" x="1220.0" y="638.0" font-size="13" fill="#1F2937" text-anchor="middle"><tspan font-weight="bold" fill="#111827">8b  </tspan>post = 816685</text>
<text xml:space="preserve" x="555.0" y="669.0" font-size="13" fill="#1F2937" text-anchor="middle"><tspan font-weight="bold" fill="#111827">9  </tspan><tspan font-family="Menlo, Consolas, monospace">31 OK col=0 pre=829570 post=816685</tspan></text>
<text xml:space="preserve" x="440.0" y="704.0" font-size="13" fill="#1F2937"><tspan font-weight="bold" fill="#111827">10  </tspan>raw → g (stored calibration);</text>
<text xml:space="preserve" x="440.0" y="721.0" font-size="13" fill="#1F2937">check drop = 6 g ± 1.2 g</text>
<text xml:space="preserve" x="440.0" y="738.0" font-size="13" fill="#1F2937">out of band → DISPENSE_FAULT</text>
<text xml:space="preserve" x="164.0" y="775.0" font-size="13" fill="#1F2937"><tspan font-weight="bold" fill="#111827">11a  </tspan>takes vial from</text>
<text xml:space="preserve" x="164.0" y="792.0" font-size="13" fill="#1F2937">the shared tray</text>
<text xml:space="preserve" x="255.0" y="825.0" font-size="13" fill="#1F2937" text-anchor="middle"><tspan font-weight="bold" fill="#111827">11b  </tspan>taps vial on the TAP HERE pad</text>
<text xml:space="preserve" x="1390.5" y="856.0" font-size="13" fill="#1F2937" text-anchor="middle"><tspan font-weight="bold" fill="#111827">11c  </tspan>vial UID (SPI)</text>
<text xml:space="preserve" x="555.0" y="887.0" font-size="13" fill="#1F2937" text-anchor="middle"><tspan font-weight="bold" fill="#111827">11d  </tspan><tspan font-family="Menlo, Consolas, monospace">! TAG 04A2B9C21F5E80</tspan></text>
<text xml:space="preserve" x="65.0" y="920.5" font-size="12" fill="#374151" font-weight="bold">alt</text>
<text xml:space="preserve" x="134.0" y="921.0" font-size="12.5" fill="#374151" font-weight="bold">[UID = expected drug + concentration]</text>
<text xml:space="preserve" x="440.0" y="952.0" font-size="13" fill="#1F2937"><tspan font-weight="bold" fill="#111827">12a  </tspan>log to CSV: drug, dose mg / mL,</text>
<text xml:space="preserve" x="440.0" y="969.0" font-size="13" fill="#1F2937">concentration, time, user,</text>
<text xml:space="preserve" x="440.0" y="986.0" font-size="13" fill="#1F2937">incident #</text>
<text xml:space="preserve" x="134.0" y="1026.0" font-size="12.5" fill="#DC2626" font-weight="bold">[mismatch]</text>
<text xml:space="preserve" x="555.0" y="1047.0" font-size="13" fill="#DC2626" text-anchor="middle"><tspan font-weight="bold" fill="#DC2626">12b  </tspan><tspan font-family="Menlo, Consolas, monospace">32 BEEP ALARM</tspan></text>
<text xml:space="preserve" x="555.0" y="1078.0" font-size="13" fill="#1F2937" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">32 OK</tspan></text>
<text xml:space="preserve" x="255.0" y="1109.0" font-size="13" fill="#DC2626" text-anchor="middle">UI blocks, red banner:</text>
<text xml:space="preserve" x="255.0" y="1126.0" font-size="13" fill="#DC2626" text-anchor="middle">“WRONG DRUG / CONCENTRATION”</text>
<text xml:space="preserve" x="120.0" y="120.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">Medic</text>
<text xml:space="preserve" x="120.0" y="139.0" font-size="12" fill="#4B5563" text-anchor="middle">paramedic / EMT</text>
<text xml:space="preserve" x="390.0" y="120.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">Host UI</text>
<text xml:space="preserve" x="390.0" y="139.0" font-size="12" fill="#4B5563" text-anchor="middle">Orange Pi 5</text>
<text xml:space="preserve" x="720.0" y="120.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">Device FW</text>
<text xml:space="preserve" x="720.0" y="139.0" font-size="12" fill="#4B5563" text-anchor="middle">micro:bit + robot:bit</text>
<text xml:space="preserve" x="955.0" y="120.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">Turret</text>
<text xml:space="preserve" x="955.0" y="139.0" font-size="12" fill="#4B5563" text-anchor="middle">servo S1 (MG90S)</text>
<text xml:space="preserve" x="1135.0" y="120.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">Dosing disc</text>
<text xml:space="preserve" x="1135.0" y="139.0" font-size="12" fill="#4B5563" text-anchor="middle">servo S2 (MG90S)</text>
<text xml:space="preserve" x="1305.0" y="120.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">Load cell</text>
<text xml:space="preserve" x="1305.0" y="139.0" font-size="12" fill="#4B5563" text-anchor="middle">HX711 + 1 kg bar</text>
<text xml:space="preserve" x="1476.0" y="120.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">RFID reader</text>
<text xml:space="preserve" x="1476.0" y="139.0" font-size="12" fill="#4B5563" text-anchor="middle">RC522 (13.56 MHz)</text>
<text xml:space="preserve" x="56.0" y="1207.0" font-size="13" fill="#111827" font-weight="bold">Legend</text>
<text xml:space="preserve" x="114.0" y="1233.0" font-size="12" fill="#4B5563">UI input / display, internal step</text>
<text xml:space="preserve" x="114.0" y="1257.0" font-size="12" fill="#4B5563">host → device command</text>
<text xml:space="preserve" x="114.0" y="1281.0" font-size="12" fill="#4B5563">device reply</text>
<text xml:space="preserve" x="403.3" y="1233.0" font-size="12" fill="#4B5563">async device event (!)</text>
<text xml:space="preserve" x="403.3" y="1257.0" font-size="12" fill="#4B5563">physical action / mechanism</text>
<text xml:space="preserve" x="403.3" y="1281.0" font-size="12" fill="#4B5563">sensor read / signal</text>
<text xml:space="preserve" x="692.7" y="1233.0" font-size="12" fill="#4B5563">sensor value returned</text>
<text xml:space="preserve" x="692.7" y="1257.0" font-size="12" fill="#4B5563">error / alarm path</text>
<text xml:space="preserve" x="692.7" y="1281.0" font-size="12" fill="#4B5563">activation (busy)</text>
<text xml:space="preserve" x="986.0" y="1207.0" font-size="13" fill="#111827" font-weight="bold">Notes</text>
<text xml:space="preserve" x="986.0" y="1231.0" font-size="13" fill="#1F2937"><tspan font-weight="bold">Interlock: </tspan><tspan font-family="Menlo, Consolas, monospace">DISPENSE</tspan> refused (<tspan font-family="Menlo, Consolas, monospace">ERR HATCH_OPEN</tspan>) while the hatch is open.</text>
<text xml:space="preserve" x="986.0" y="1255.0" font-size="13" fill="#1F2937">Sequence numbers (31, 32) are illustrative; the host increments</text>
<text xml:space="preserve" x="1000.0" y="1273.0" font-size="13" fill="#1F2937"><tspan font-family="Menlo, Consolas, monospace">&lt;seq&gt;</tspan> per command (1..9999).</text>
<text xml:space="preserve" x="40.0" y="48.0" font-size="24" fill="#111827" font-weight="bold">Fig 10 — Sequence: regular medication dispense</text>
<text xml:space="preserve" x="40.0" y="74.0" font-size="14" fill="#4B5563">One DISPENSE command: weigh, turn the column to the front, cycle the dosing disc, weigh again; the host checks the drop and the vial tag.</text>
<text xml:space="preserve" x="1560.0" y="1325.0" font-size="11" fill="#9CA3AF" text-anchor="end">Smart Med Station · Hardware design v2.1 · 2026-10-07</text></g>
</svg>
