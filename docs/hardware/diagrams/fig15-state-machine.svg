<g id="layer-text"><text xml:space="preserve" x="250.0" y="194.0" font-size="15" fill="#111827" text-anchor="middle" font-weight="bold">BOOT</text>
<text xml:space="preserve" x="250.0" y="212.0" font-size="12" fill="#4B5563" text-anchor="middle">init, disc → REST</text>
<text xml:space="preserve" x="262.0" y="156.0" font-size="13" fill="#1F2937">power-on</text>
<text xml:space="preserve" x="250.0" y="430.0" font-size="15" fill="#111827" text-anchor="middle" font-weight="bold">SAFE</text>
<text xml:space="preserve" x="250.0" y="448.0" font-size="12" fill="#4B5563" text-anchor="middle">all servo PWM off, no motion</text>
<text xml:space="preserve" x="250.0" y="464.0" font-size="12" fill="#4B5563" text-anchor="middle">disc at REST</text>
<text xml:space="preserve" x="264.0" y="296.0" font-size="13" fill="#1F2937">init done</text>
<text xml:space="preserve" x="264.0" y="313.0" font-size="13" fill="#1F2937">/ emit <tspan font-family="Menlo, Consolas, monospace">! BOOT</tspan>,</text>
<text xml:space="preserve" x="264.0" y="330.0" font-size="13" fill="#1F2937">all servo PWM off</text>
<text xml:space="preserve" x="690.0" y="462.0" font-size="15" fill="#111827" text-anchor="middle" font-weight="bold">READY</text>
<text xml:space="preserve" x="690.0" y="480.0" font-size="12" fill="#4B5563" text-anchor="middle">idle, servo PWM off</text>
<text xml:space="preserve" x="690.0" y="496.0" font-size="12" fill="#4B5563" text-anchor="middle">accepts commands</text>
<text xml:space="preserve" x="475.0" y="393.0" font-size="13" fill="#1F2937" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">PING</tspan> (after <tspan font-family="Menlo, Consolas, monospace">CFG …</tspan>)</text>
<text xml:space="preserve" x="475.0" y="410.0" font-size="13" fill="#1F2937" text-anchor="middle">/ <tspan font-family="Menlo, Consolas, monospace">OK state=READY</tspan></text>
<text xml:space="preserve" x="690.0" y="124.0" font-size="13" fill="#1F2937" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">GOTO k</tspan> or <tspan font-family="Menlo, Consolas, monospace">DISPENSE k</tspan> [hatch OPEN] / <tspan font-family="Menlo, Consolas, monospace">ERR HATCH_OPEN</tspan></text>
<text xml:space="preserve" x="690.0" y="141.0" font-size="13" fill="#1F2937" text-anchor="middle">motion command [busy] / <tspan font-family="Menlo, Consolas, monospace">ERR BUSY</tspan></text>
<text xml:space="preserve" x="1090.0" y="267.0" font-size="15" fill="#111827" text-anchor="middle" font-weight="bold">MOVING</text>
<text xml:space="preserve" x="1090.0" y="285.0" font-size="12" fill="#4B5563" text-anchor="middle">turret rotating (≤ 2 s)</text>
<text xml:space="preserve" x="890.0" y="231.0" font-size="13" fill="#1F2937" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">GOTO k</tspan> [hatch CLOSED]</text>
<text xml:space="preserve" x="890.0" y="248.0" font-size="13" fill="#1F2937" text-anchor="middle">/ ramp S1</text>
<text xml:space="preserve" x="890.0" y="303.0" font-size="13" fill="#1F2937" text-anchor="middle">S1 settled</text>
<text xml:space="preserve" x="890.0" y="320.0" font-size="13" fill="#1F2937" text-anchor="middle">(approached from below)</text>
<text xml:space="preserve" x="890.0" y="337.0" font-size="13" fill="#1F2937" text-anchor="middle">/ <tspan font-family="Menlo, Consolas, monospace">OK col=k</tspan>, PWM off</text>
<text xml:space="preserve" x="1090.0" y="447.0" font-size="15" fill="#111827" text-anchor="middle" font-weight="bold">UNLOCK_WINDOW</text>
<text xml:space="preserve" x="1090.0" y="465.0" font-size="12" fill="#4B5563" text-anchor="middle">cam OPEN, default 5 s</text>
<text xml:space="preserve" x="890.0" y="411.0" font-size="13" fill="#1F2937" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">UNLOCK [ms]</tspan></text>
<text xml:space="preserve" x="890.0" y="428.0" font-size="13" fill="#1F2937" text-anchor="middle">/ cam → OPEN</text>
<text xml:space="preserve" x="890.0" y="483.0" font-size="13" fill="#1F2937" text-anchor="middle">hatch opened, or timeout</text>
<text xml:space="preserve" x="890.0" y="500.0" font-size="13" fill="#1F2937" text-anchor="middle">/ cam → REST,</text>
<text xml:space="preserve" x="890.0" y="517.0" font-size="13" fill="#1F2937" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">OK opened|timeout</tspan></text>
<text xml:space="preserve" x="1090.0" y="614.0" font-size="15" fill="#111827" text-anchor="middle" font-weight="bold">DISPENSING</text>
<text xml:space="preserve" x="1090.0" y="631.0" font-size="12" fill="#4B5563" text-anchor="middle">≤ 5.0 s (≈ 3.2 s if in front)</text>
<text xml:space="preserve" x="1090.0" y="659.5" font-size="12" fill="#1F2937" text-anchor="middle">1  pre-weigh (median 7)</text>
<text xml:space="preserve" x="1090.0" y="693.5" font-size="12" fill="#1F2937" text-anchor="middle">2  move S1 (if needed)</text>
<text xml:space="preserve" x="1090.0" y="727.5" font-size="12" fill="#1F2937" text-anchor="middle">3  disc LOAD → REST</text>
<text xml:space="preserve" x="1090.0" y="761.5" font-size="12" fill="#1F2937" text-anchor="middle">4  settle 1.0 s</text>
<text xml:space="preserve" x="1090.0" y="795.5" font-size="12" fill="#1F2937" text-anchor="middle">5  post-weigh (median 7)</text>
<text xml:space="preserve" x="890.0" y="625.0" font-size="13" fill="#1F2937" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">DISPENSE k</tspan> [hatch CLOSED]</text>
<text xml:space="preserve" x="890.0" y="642.0" font-size="13" fill="#1F2937" text-anchor="middle">/ start pre-weigh</text>
<text xml:space="preserve" x="890.0" y="697.0" font-size="13" fill="#1F2937" text-anchor="middle">post-weigh done</text>
<text xml:space="preserve" x="890.0" y="714.0" font-size="13" fill="#1F2937" text-anchor="middle">/ <tspan font-family="Menlo, Consolas, monospace">OK col pre post</tspan></text>
<text xml:space="preserve" x="460.0" y="677.0" font-size="15" fill="#111827" text-anchor="middle" font-weight="bold">FAULT</text>
<text xml:space="preserve" x="460.0" y="695.0" font-size="12" fill="#4B5563" text-anchor="middle">PWM off, awaits RESET</text>
<text xml:space="preserve" x="434.0" y="560.0" font-size="13" fill="#1F2937"><tspan font-family="Menlo, Consolas, monospace">RESET</tspan> from host</text>
<text xml:space="preserve" x="434.0" y="577.0" font-size="13" fill="#1F2937">or reboot</text>
<text xml:space="preserve" x="810.0" y="884.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">any state</text>
<text xml:space="preserve" x="810.0" y="903.0" font-size="12" fill="#4B5563" text-anchor="middle">incl. MOVING, UNLOCK_WINDOW, DISPENSING</text>
<text xml:space="preserve" x="214.0" y="592.0" font-size="13" fill="#1F2937">no host traffic 10 s</text>
<text xml:space="preserve" x="214.0" y="609.0" font-size="13" fill="#1F2937">/ PWM off</text>
<text xml:space="preserve" x="474.0" y="800.0" font-size="13" fill="#1F2937">HW fault (I2C / HX711 / RFID)</text>
<text xml:space="preserve" x="474.0" y="817.0" font-size="13" fill="#1F2937">/ <tspan font-family="Menlo, Consolas, monospace">! FAULT</tspan>, PWM off</text>
<text xml:space="preserve" x="1230.0" y="130.0" font-size="14" fill="#111827" font-weight="bold">Always running in every state</text>
<text xml:space="preserve" x="1246.0" y="156.0" font-size="13" fill="#1F2937"><tspan font-weight="bold">Hatch monitor</tspan> — debounce 50 ms</text>
<text xml:space="preserve" x="1246.0" y="174.0" font-size="13" fill="#1F2937">→ <tspan font-family="Menlo, Consolas, monospace">! HATCH OPEN|CLOSED</tspan></text>
<text xml:space="preserve" x="1246.0" y="192.0" font-size="13" fill="#1F2937">opened outside UNLOCK_WINDOW</text>
<text xml:space="preserve" x="1246.0" y="210.0" font-size="13" fill="#1F2937">→ <tspan font-family="Menlo, Consolas, monospace">! FORCED</tspan></text>
<text xml:space="preserve" x="1246.0" y="236.0" font-size="13" fill="#1F2937"><tspan font-weight="bold">RFID poll</tspan> every 100 ms → <tspan font-family="Menlo, Consolas, monospace">! TAG</tspan></text>
<text xml:space="preserve" x="1246.0" y="262.0" font-size="13" fill="#1F2937"><tspan font-weight="bold">Accelerometer</tspan> shock → <tspan font-family="Menlo, Consolas, monospace">! SHOCK</tspan></text>
<text xml:space="preserve" x="1246.0" y="280.0" font-size="13" fill="#1F2937">(ignored while S1 / S2 move)</text>
<text xml:space="preserve" x="1246.0" y="306.0" font-size="13" fill="#1F2937"><tspan font-weight="bold">Heartbeat</tspan> <tspan font-family="Menlo, Consolas, monospace">! HB</tspan> at 1 Hz</text>
<text xml:space="preserve" x="1230.0" y="368.0" font-size="14" fill="#111827" font-weight="bold">Interlocks</text>
<text xml:space="preserve" x="1246.0" y="394.0" font-size="13" fill="#1F2937">Turret moves only with the disc at REST,</text>
<text xml:space="preserve" x="1246.0" y="412.0" font-size="13" fill="#1F2937">the hatch CLOSED and no unlock window</text>
<text xml:space="preserve" x="1246.0" y="438.0" font-size="13" fill="#1F2937">Disc always ends at REST</text>
<text xml:space="preserve" x="1246.0" y="456.0" font-size="13" fill="#1F2937">(driven there at boot)</text>
<text xml:space="preserve" x="1246.0" y="482.0" font-size="13" fill="#1F2937">Cam always returns to REST</text>
<text xml:space="preserve" x="1246.0" y="508.0" font-size="13" fill="#1F2937">One servo MOVING at a time</text>
<text xml:space="preserve" x="1246.0" y="526.0" font-size="13" fill="#1F2937">(S1 holds while S2 moves)</text>
<text xml:space="preserve" x="1246.0" y="552.0" font-size="13" fill="#1F2937">Max unlock window 10 s</text>
<text xml:space="preserve" x="1246.0" y="578.0" font-size="13" fill="#1F2937">Device never decides auth</text>
<text xml:space="preserve" x="1230.0" y="640.0" font-size="14" fill="#111827" font-weight="bold">Notation</text>
<text xml:space="preserve" x="1266.0" y="669.0" font-size="12" fill="#4B5563">initial pseudo-state</text>
<text xml:space="preserve" x="1266.0" y="698.0" font-size="12" fill="#4B5563">transition: <tspan font-style="italic">event [guard] / action</tspan></text>
<text xml:space="preserve" x="1266.0" y="730.0" font-size="12" fill="#4B5563">SAFE</text>
<text xml:space="preserve" x="1374.0" y="730.0" font-size="12" fill="#4B5563">normal</text>
<text xml:space="preserve" x="1482.0" y="730.0" font-size="12" fill="#4B5563">FAULT</text>
<text xml:space="preserve" x="1230.0" y="752.0" font-size="12" fill="#4B5563">Monospace tokens are serial-protocol strings.</text>
<text xml:space="preserve" x="40.0" y="48.0" font-size="24" fill="#111827" font-weight="bold">Fig 15 — Device firmware state machine</text>
<text xml:space="preserve" x="40.0" y="74.0" font-size="14" fill="#4B5563">micro:bit MicroPython firmware (v2.1 Med Tower): the host commands every motion; the device enforces the hatch and disc interlocks and falls back to SAFE.</text>
<text xml:space="preserve" x="1560.0" y="960.0" font-size="11" fill="#9CA3AF" text-anchor="end">Smart Med Station · Hardware design v2.1 · 2026-10-07</text></g>
</svg>
